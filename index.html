<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UU模拟器 - AI驱动文字冒险游戏平台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <div class="nav-brand" onclick="navigate('home')">
        <span class="brand-icon">UU</span>
        <span class="brand-text">模拟器</span>
      </div>
      <div class="nav-links">
        <a onclick="navigate('home')" class="nav-link" id="nav-home">首页</a>
        <a onclick="navigate('lobby')" class="nav-link" id="nav-lobby">游戏大厅</a>
        <a onclick="navigate('creator')" class="nav-link" id="nav-creator">创作工坊</a>
      </div>
      <div class="nav-auth">
        <button class="btn btn-sm btn-primary" id="btn-login" onclick="showAuth()">登录</button>
        <div class="user-menu" id="user-menu" style="display:none">
          <span class="user-name" id="user-name-display"></span>
          <div class="user-dropdown">
            <a onclick="navigate('lobby')">游戏大厅</a>
            <a onclick="navigate('creator')">创作工坊</a>
            <a onclick="logout()">退出登录</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主内容区域 -->
  <main id="main-content">
    <!-- 由路由填充 -->
    <div class="page" id="page-loading" style="display:flex;align-items:center;justify-content:center;min-height:80vh">
      <div style="text-align:center">
        <div style="font-size:48px;margin-bottom:16px">🐉</div>
        <h2>正在唤醒龙血...</h2>
        <p style="color:var(--text-muted);margin-top:8px">UU模拟器加载中</p>
      </div>
    </div>
  </main>

  <!-- 登录/注册弹窗 -->
  <div class="modal-overlay" id="auth-modal" style="display:none" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="auth-title">登录</h2>
        <span class="modal-close" onclick="closeModal()">&times;</span>
      </div>
      <div class="modal-body">
        <div class="auth-tabs">
          <button class="auth-tab active" onclick="switchAuth('login')" id="tab-login">登录</button>
          <button class="auth-tab" onclick="switchAuth('register')" id="tab-register">注册</button>
        </div>
        <form id="auth-form" onsubmit="handleAuth(event)">
          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="auth-username" placeholder="输入用户名" required autocomplete="username">
          </div>
          <div class="form-group" id="reg-nick-group" style="display:none">
            <label>昵称</label>
            <input type="text" id="auth-nick" placeholder="输入昵称">
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="auth-password" placeholder="输入密码" required autocomplete="current-password">
          </div>
          <div class="form-group" id="reg-pwd2-group" style="display:none">
            <label>确认密码</label>
            <input type="password" id="auth-password2" placeholder="再次输入密码">
          </div>
          <div class="form-error" id="auth-error"></div>
          <button type="submit" class="btn btn-primary btn-full" id="auth-submit">登录</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 通用弹窗（存档、导入等复用） -->
  <div class="modal-overlay" id="save-modal" style="display:none" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h2 id="save-modal-title">存档</h2>
        <span class="modal-close" onclick="closeModalById('save-modal')">&times;</span>
      </div>
      <div class="modal-body" id="save-modal-body">
      </div>
    </div>
  </div>
</div>

<!-- 脚本加载 -->
<script src="js/core.js"></script>
<script src="js/dragonraja.js"></script>
<script src="js/lobby.js"></script>
<script src="js/character.js"></script>
<script src="js/engine.js"></script>
<script src="js/creator.js"></script>
</body>
</html>
