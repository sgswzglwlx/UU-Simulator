<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UU模拟器 - AI驱动文字冒险游戏平台</title>
<style>/* ========================================
   UU模拟器 - 完整游戏风格UI
   主题：龙族 · 暗色奇幻
   ======================================== */

/* === 全局重置 & 变量 === */
:root {
  --bg-primary: #0a0a14;
  --bg-secondary: #12121f;
  --bg-card: #1a1a2e;
  --bg-card-hover: #222240;
  --bg-input: #16213e;
  --border-color: #2a2a4a;
  --border-glow: #4a4a8a;
  --text-primary: #e0e0f0;
  --text-secondary: #9090b0;
  --text-muted: #606080;
  --accent-gold: #d4a843;
  --accent-red: #cc3333;
  --accent-blue: #3366cc;
  --accent-green: #33aa55;
  --accent-purple: #8844aa;
  --accent-cyan: #33cccc;
  --danger: #ff4444;
  --success: #44cc66;
  --warning: #ffaa33;
  --info: #4488ff;
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --transition: all 0.3s ease;
  --font-main: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif;
  --font-mono: 'Consolas', 'Courier New', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-main);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.6;
  font-size: 15px;
}
a { color: var(--accent-gold); text-decoration: none; cursor: pointer; }
a:hover { text-decoration: underline; }
button { cursor: pointer; font-family: inherit; border: none; outline: none; }
input, textarea, select { font-family: inherit; font-size: inherit; }
ul { list-style: none; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-glow); }

/* === 导航栏 === */
.navbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 56px; background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  z-index: 1000;
  display: flex; align-items: center;
}
.nav-inner {
  width: 100%; max-width: 1400px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
  cursor: pointer; user-select: none;
}
.brand-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent-gold), #8b6914);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 16px; color: #fff;
}
.brand-text { font-size: 20px; font-weight: 700; color: var(--accent-gold); letter-spacing: 2px; }
.nav-links { display: flex; gap: 8px; }
.nav-link {
  padding: 8px 16px; border-radius: var(--radius-sm);
  color: var(--text-secondary); font-size: 14px;
  transition: var(--transition);
}
.nav-link:hover { background: var(--bg-card); color: var(--text-primary); text-decoration: none; }
.nav-link.active { background: var(--bg-card); color: var(--accent-gold); }
.nav-auth { display: flex; align-items: center; gap: 12px; }
.user-menu { position: relative; cursor: pointer; }
.user-name { color: var(--accent-gold); font-size: 14px; }
.user-dropdown {
  position: absolute; top: 100%; right: 0; margin-top: 8px;
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); min-width: 140px;
  display: none; overflow: hidden;
}
.user-menu:hover .user-dropdown { display: block; }
.user-dropdown a {
  display: block; padding: 10px 16px; color: var(--text-secondary);
  font-size: 13px; transition: var(--transition);
}
.user-dropdown a:hover { background: var(--bg-card-hover); color: var(--text-primary); text-decoration: none; }

/* === 按钮系统 === */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 500; transition: var(--transition);
}
.btn-sm { padding: 6px 14px; font-size: 13px; }
.btn-lg { padding: 14px 28px; font-size: 16px; }
.btn-full { width: 100%; }
.btn-primary { background: var(--accent-gold); color: #1a1a2e; }
.btn-primary:hover { background: #e8bc50; transform: translateY(-1px); }
.btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); }
.btn-secondary:hover { background: var(--bg-card-hover); border-color: var(--border-glow); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #ff5555; }
.btn-ghost { background: transparent; color: var(--text-secondary); }
.btn-ghost:hover { background: var(--bg-card); color: var(--text-primary); }
.btn-choice {
  width: 100%; text-align: left; padding: 14px 20px;
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); color: var(--text-primary);
  font-size: 14px; line-height: 1.5; margin-bottom: 10px;
  transition: var(--transition);
}
.btn-choice:hover {
  background: var(--bg-card-hover); border-color: var(--accent-gold);
  transform: translateX(4px); box-shadow: 0 2px 12px rgba(212,168,67,0.15);
}
.btn-choice .hint { display: block; font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.btn-choice.selected { border-color: var(--accent-gold); background: rgba(212,168,67,0.1); }

/* === 弹窗 === */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  z-index: 2000; display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: var(--radius-lg); width: 90%; max-width: 520px;
  max-height: 85vh; overflow: hidden;
  animation: slideUp 0.25s ease;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
@keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-wide { max-width: 1000px; }
.modal-sm { max-width: 400px; }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; border-bottom: 1px solid var(--border-color);
}
.modal-header h2 { font-size: 18px; font-weight: 600; }
.modal-header-actions { display: flex; gap: 8px; align-items: center; }
.modal-close { font-size: 24px; color: var(--text-muted); cursor: pointer; transition: var(--transition); }
.modal-close:hover { color: var(--text-primary); }
.modal-body { padding: 24px; overflow-y: auto; max-height: calc(85vh - 60px); }

/* === 表单 === */
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 10px 14px;
  background: var(--bg-input); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); color: var(--text-primary);
  transition: var(--transition);
}
.form-group input:focus, .form-group textarea:focus, .form-group select:focus {
  border-color: var(--accent-gold); outline: none; box-shadow: 0 0 0 2px rgba(212,168,67,0.15);
}
.form-group textarea { resize: vertical; min-height: 80px; }
.form-error { color: var(--danger); font-size: 13px; margin-bottom: 12px; display: none; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }

/* === 认证弹窗 === */
.auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); }
.auth-tab {
  flex: 1; padding: 10px; text-align: center;
  background: none; color: var(--text-muted); font-size: 14px;
  border-bottom: 2px solid transparent; transition: var(--transition);
}
.auth-tab.active { color: var(--accent-gold); border-bottom-color: var(--accent-gold); }
.auth-tab:hover { color: var(--text-secondary); }

/* === 页面容器 === */
.page { display: none; padding: 80px 24px 24px; min-height: 100vh; }
.page.active { display: block; }
.page-header {
  text-align: center; margin-bottom: 32px;
  max-width: 1400px; margin-left: auto; margin-right: auto;
}
.page-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
.page-header p { color: var(--text-secondary); font-size: 14px; }
.page-content { max-width: 1400px; margin: 0 auto; }

/* === 首页 === */
.hero {
  text-align: center; padding: 60px 20px 40px;
  background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-primary) 100%);
  border-radius: var(--radius-lg); margin-bottom: 40px;
}
.hero h1 { font-size: 36px; font-weight: 800; margin-bottom: 12px; }
.hero h1 span { color: var(--accent-gold); }
.hero p { color: var(--text-secondary); font-size: 16px; max-width: 600px; margin: 0 auto 24px; }
.featured-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px; margin-top: 24px;
}

/* === 游戏卡片 === */
.game-card {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); overflow: hidden;
  transition: var(--transition); cursor: pointer;
}
.game-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); border-color: var(--border-glow); }
.game-card-banner {
  height: 140px; background: linear-gradient(135deg, #1a1a3e, #2a1a2e);
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; position: relative; overflow: hidden;
}
.game-card-banner .overlay {
  position: absolute; inset: 0;
  background: linear-gradient(0deg, var(--bg-card) 0%, transparent 60%);
}
.game-card-body { padding: 16px; }
.game-card-body h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.game-card-body p { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
.game-card-meta {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; border-top: 1px solid var(--border-color);
  font-size: 12px; color: var(--text-muted);
}
.game-card-meta .tag {
  padding: 2px 8px; border-radius: 4px; font-size: 11px;
  background: rgba(212,168,67,0.15); color: var(--accent-gold);
}

/* === 角色创建 === */
.creation-steps {
  display: flex; gap: 8px; margin-bottom: 32px; justify-content: center;
}
.step {
  padding: 8px 20px; border-radius: 20px; font-size: 13px;
  background: var(--bg-card); color: var(--text-muted);
  transition: var(--transition);
}
.step.active { background: var(--accent-gold); color: #1a1a2e; font-weight: 600; }
.step.done { background: rgba(212,168,67,0.2); color: var(--accent-gold); }

.creation-panel {
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
}
.creation-preview {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); padding: 24px; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 300px;
}
.creation-preview .avatar-placeholder {
  width: 120px; height: 120px; border-radius: 50%;
  background: linear-gradient(135deg, #2a1a3e, #1a2a3e);
  border: 3px solid var(--border-glow); margin-bottom: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; color: var(--accent-gold);
}
.creation-preview h3 { font-size: 20px; margin-bottom: 8px; }
.creation-preview .stat-list { width: 100%; margin-top: 16px; }
.stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
.stat-row .stat-name { color: var(--text-secondary); }
.stat-row .stat-val { color: var(--accent-gold); font-weight: 600; }
.creation-form { display: flex; flex-direction: column; gap: 16px; }
.option-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
}
.option-card {
  padding: 12px; border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); background: var(--bg-input);
  cursor: pointer; transition: var(--transition); text-align: center;
  font-size: 13px;
}
.option-card:hover { border-color: var(--border-glow); }
.option-card.selected { border-color: var(--accent-gold); background: rgba(212,168,67,0.1); }
.option-card .opt-desc { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

/* === 游戏主界面 === */
.game-layout {
  display: grid; grid-template-columns: 240px 1fr 240px;
  gap: 0; height: calc(100vh - 56px); margin-top: 56px;
}
.game-sidebar {
  background: var(--bg-secondary); border-right: 1px solid var(--border-color);
  padding: 16px; overflow-y: auto;
}
.game-sidebar-right {
  background: var(--bg-secondary); border-left: 1px solid var(--border-color);
  padding: 16px; overflow-y: auto;
}
.game-main {
  padding: 24px; overflow-y: auto;
  display: flex; flex-direction: column;
}

/* 角色信息面板 */
.char-portrait {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, #2a1a3e, #1a2a3e);
  border: 2px solid var(--border-glow); margin: 0 auto 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; color: var(--accent-gold);
}
.sidebar-section { margin-bottom: 20px; }
.sidebar-section h4 {
  font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 10px; border-bottom: 1px solid var(--border-color);
  padding-bottom: 6px;
}
.stat-bar {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  font-size: 12px;
}
.stat-bar .label { width: 50px; color: var(--text-secondary); flex-shrink: 0; }
.stat-bar .bar-bg {
  flex: 1; height: 6px; background: var(--bg-input);
  border-radius: 3px; overflow: hidden;
}
.stat-bar .bar-fill {
  height: 100%; border-radius: 3px; transition: width 0.5s ease;
}
.stat-bar .value { width: 30px; text-align: right; color: var(--text-primary); font-size: 12px; }

/* 叙事区域 */
.narrative-area {
  flex: 1; overflow-y: auto; margin-bottom: 20px;
}
.narrative-text {
  font-size: 15px; line-height: 1.9; color: var(--text-primary);
  white-space: pre-wrap;
}
.narrative-text .location-tag {
  display: inline-block; padding: 2px 10px; border-radius: 4px;
  background: rgba(212,168,67,0.15); color: var(--accent-gold);
  font-size: 12px; margin-bottom: 12px;
}
.narrative-text .npc-name { color: var(--accent-cyan); font-weight: 600; }
.narrative-text .item-name { color: var(--accent-purple); }
.narrative-text .system-msg {
  color: var(--text-muted); font-size: 13px; font-style: italic;
  padding: 8px 0;
}
.narrative-text .combat-log {
  color: var(--accent-red); font-family: var(--font-mono); font-size: 13px;
  padding: 4px 0;
}
.narrative-text .success { color: var(--success); }
.narrative-text .failure { color: var(--danger); }

.choices-area { padding-top: 16px; border-top: 1px solid var(--border-color); }
.choices-area h4 { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }

/* 对话气泡 */
.dialogue-box {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); padding: 16px 20px; margin: 12px 0;
  position: relative;
}
.dialogue-box .speaker {
  font-size: 13px; font-weight: 600; color: var(--accent-cyan); margin-bottom: 6px;
}
.dialogue-box .speaker.诺诺 { color: #ff6688; }
.dialogue-box .speaker.楚子航 { color: #6688ff; }
.dialogue-box .speaker.凯撒 { color: #ffcc44; }
.dialogue-box .speaker.路明非 { color: #88cc88; }
.dialogue-box .speaker.昂热 { color: #cccccc; }

/* 战斗界面 */
.combat-overlay {
  background: rgba(10,10,20,0.95); border: 2px solid var(--accent-red);
  border-radius: var(--radius-lg); padding: 24px; margin: 16px 0;
}
.combat-overlay .combat-title {
  text-align: center; font-size: 20px; font-weight: 700;
  color: var(--accent-red); margin-bottom: 16px;
}
.combat-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;
}
.combatant { text-align: center; }
.combatant .name { font-weight: 600; margin-bottom: 4px; }
.combatant .hp-bar { height: 8px; background: var(--bg-input); border-radius: 4px; overflow: hidden; }
.combatant .hp-fill { height: 100%; background: linear-gradient(90deg, var(--accent-red), var(--accent-gold)); border-radius: 4px; transition: width 0.5s; }
.combat-log-area {
  background: #0a0a0a; border-radius: var(--radius-sm);
  padding: 12px; font-family: var(--font-mono); font-size: 13px;
  max-height: 200px; overflow-y: auto; margin-bottom: 12px;
}

/* 背包网格 */
.inventory-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
}
.inv-slot {
  aspect-ratio: 1; background: var(--bg-input);
  border: 1px solid var(--border-color); border-radius: var(--radius-sm);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; cursor: pointer; transition: var(--transition);
}
.inv-slot:hover { border-color: var(--accent-gold); }
.inv-slot.has-item { border-color: var(--accent-purple); background: rgba(136,68,170,0.1); }

/* 地图 */
.map-container {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); padding: 16px; min-height: 200px;
  position: relative;
}
.map-location {
  padding: 8px 12px; margin: 4px 0; border-radius: var(--radius-sm);
  background: var(--bg-input); cursor: pointer; font-size: 13px;
  transition: var(--transition);
}
.map-location:hover { background: var(--bg-card-hover); }
.map-location.current { border-left: 3px solid var(--accent-gold); color: var(--accent-gold); }
.map-location.visited { opacity: 0.7; }
.map-location.locked { opacity: 0.3; cursor: not-allowed; }

/* 导入工具 */
.import-area textarea {
  width: 100%; min-height: 200px; padding: 16px;
  background: var(--bg-input); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); color: var(--text-primary);
  font-family: var(--font-mono); font-size: 13px; resize: vertical;
}
.import-actions { display: flex; gap: 8px; margin-top: 12px; }

/* 创作者工坊 */
.creator-workspace {
  display: grid; grid-template-columns: 1fr 1fr; gap: 24px;
}
.template-editor textarea {
  width: 100%; min-height: 400px; padding: 16px;
  background: var(--bg-input); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); color: var(--text-primary);
  font-family: var(--font-mono); font-size: 13px;
}
.template-preview {
  background: var(--bg-card); border: 1px solid var(--border-color);
  border-radius: var(--radius-md); padding: 24px;
}

/* 游戏大厅筛选 */
.lobby-filters {
  display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
}
.filter-tag {
  padding: 6px 14px; border-radius: 20px; font-size: 13px;
  background: var(--bg-card); color: var(--text-secondary);
  cursor: pointer; transition: var(--transition);
}
.filter-tag:hover { background: var(--bg-card-hover); }
.filter-tag.active { background: var(--accent-gold); color: #1a1a2e; }

/* 存档列表 */
.save-list { display: flex; flex-direction: column; gap: 8px; }
.save-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px; background: var(--bg-card);
  border: 1px solid var(--border-color); border-radius: var(--radius-sm);
  cursor: pointer; transition: var(--transition);
}
.save-item:hover { border-color: var(--border-glow); }
.save-item .save-info { flex: 1; }
.save-item .save-title { font-size: 14px; font-weight: 500; }
.save-item .save-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.save-item .save-actions { display: flex; gap: 6px; }

/* 响应式 */
@media (max-width: 1024px) {
  .game-layout { grid-template-columns: 1fr; }
  .game-sidebar, .game-sidebar-right { display: none; }
  .creation-panel { grid-template-columns: 1fr; }
  .creator-workspace { grid-template-columns: 1fr; }
}
@media (max-width: 768px) {
  .nav-links { display: none; }
  .option-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div id="app">
  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <div class="nav-brand" onclick="navigate('home')">
        <span class="brand-icon">UU</span>
        <span class="brand-text">模拟器</span>
      </div>
      <div class="nav-links">
        <a onclick="navigate('home')" class="nav-link" id="nav-home">首页</a>
        <a onclick="navigate('lobby')" class="nav-link" id="nav-lobby">游戏大厅</a>
        <a onclick="navigate('creator')" class="nav-link" id="nav-creator">创作工坊</a>
      </div>
      <div class="nav-auth">

<script>/* ========================================
   UU模拟器 - 核心引擎 (Core)
   路由、状态管理、存储、UI基础设施
   ======================================== */

// ==========================================
// 存储引擎 (IndexedDB + localStorage 双保险)
// ==========================================
const Store = {
  _db: null,
  _ready: false,

  async init() {
    // 加超时：IndexedDB 3秒打不开就跳过（解决手机浏览器卡死问题）
    try {
      const timeout = new Promise((_, reject) => 
        setTimeout(() => reject(new Error('IndexedDB超时')), 3000)
      );
      this._db = await Promise.race([this._openDB(), timeout]);
      this._ready = true;
    } catch(e) {
      console.warn('IndexedDB不可用或超时，回退到localStorage', e);
      this._ready = false;
      this._db = null;
    }
  },

  _openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('UUPlatform', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('users')) {
          db.createObjectStore('users', { keyPath: 'username' });
        }
        if (!db.objectStoreNames.contains('characters')) {
          const cs = db.createObjectStore('characters', { keyPath: 'id', autoIncrement: true });
          cs.createIndex('username', 'username', { unique: false });
        }
        if (!db.objectStoreNames.contains('saves')) {
          const ss = db.createObjectStore('saves', { keyPath: 'id', autoIncrement: true });
          ss.createIndex('charId', 'charId', { unique: false });
        }
        if (!db.objectStoreNames.contains('games')) {
          db.createObjectStore('games', { keyPath: 'slug' });
        }
        if (!db.objectStoreNames.contains('settings')) {
          db.createObjectStore('settings', { keyPath: 'key' });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e.target.error);
    });
  },

  _getStore(name, mode = 'readonly') {
    if (!this._db || !this._ready) return null;
    try {
      const tx = this._db.transaction(name, mode);
      return tx.objectStore(name);
    } catch(e) {
      console.warn('获取存储对象失败:', e);
      return null;
    }
  },

  async get(store, key) {
    if (this._ready && this._db) {
      try {
        const os = this._getStore(store);
        if (!os) throw new Error('DB not ready');
        return new Promise((res, rej) => {
          const req = os.get(key);
          req.onsuccess = () => res(req.result || null);
          req.onerror = () => rej(req.error);
        });
      } catch(e) {
        return this._lsGet(store, key);
      }
    }
    return this._lsGet(store, key);
  },

  async getAll(store) {
    if (this._ready && this._db) {
      try {
        const os = this._getStore(store);
        if (!os) throw new Error('DB not ready');
        return new Promise((res, rej) => {
          const req = os.getAll();
          req.onsuccess = () => res(req.result || []);
          req.onerror = () => rej(req.error);
        });
      } catch(e) {
        return this._lsGetAll(store);
      }
    }
    return this._lsGetAll(store);
  },

  async put(store, data) {
    if (this._ready && this._db) {
      try {
        const os = this._getStore(store, 'readwrite');
        if (!os) throw new Error('DB not ready');
        return new Promise((res, rej) => {
          const req = os.put(data);
          req.onsuccess = () => res(req.result);
          req.onerror = () => rej(req.error);
        });
      } catch(e) {
        return this._lsPut(store, data);
      }
    }
    return this._lsPut(store, data);
  },

  async delete(store, key) {
    if (this._ready && this._db) {
      try {
        const os = this._getStore(store, 'readwrite');
        if (!os) throw new Error('DB not ready');
        return new Promise((res, rej) => {
          const req = os.delete(key);
          req.onsuccess = () => res(true);
          req.onerror = () => rej(req.error);
        });
      } catch(e) {
        return this._lsDelete(store, key);
      }
    }
    return this._lsDelete(store, key);
  },

  // localStorage fallback
  _lsGet(store, key) {
    try {
      const data = JSON.parse(localStorage.getItem(`uu_${store}`) || '{}');
      return data[key] || null;
    } catch { return null; }
  },
  _lsGetAll(store) {
    try {
      return Object.values(JSON.parse(localStorage.getItem(`uu_${store}`) || '{}'));
    } catch { return []; }
  },
  _lsPut(store, data) {
    try {
      const key = data.id || data.username || data.slug || data.key;
      const all = JSON.parse(localStorage.getItem(`uu_${store}`) || '{}');
      all[key] = data;
      localStorage.setItem(`uu_${store}`, JSON.stringify(all));
      return true;
    } catch { return false; }
  },
  _lsDelete(store, key) {
    try {
      const all = JSON.parse(localStorage.getItem(`uu_${store}`) || '{}');
      delete all[key];
      localStorage.setItem(`uu_${store}`, JSON.stringify(all));
      return true;
    } catch { return false; }
  }
};

// ==========================================
// 路由系统
// ==========================================
const Router = {
  current: null,
  routes: {},

  register(name, renderFn) {
    this.routes[name] = renderFn;
  },

  async go(name, params = {}) {
    this.current = name;
    const main = document.getElementById('main-content');
    // Hide all pages
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    // Show or create page
    let page = document.getElementById(`page-${name}`);
    if (!page) {
      page = document.createElement('div');
      page.id = `page-${name}`;
      page.className = 'page';
      main.appendChild(page);
    }
    page.classList.add('active');
    // Render
    if (this.routes[name]) {
      page.innerHTML = '<div class="loading">加载中...</div>';
      try {
        page.innerHTML = await this.routes[name](params);
      } catch(e) {
        page.innerHTML = `<div class="page-error">加载失败: ${e.message}</div>`;
        console.error(e);
      }
    }
    // Update nav
    document.querySelectorAll('.nav-link').forEach(l => {
      l.classList.toggle('active', l.getAttribute('onclick')?.includes(name));
    });
    window.scrollTo(0, 0);
  }
};

// ==========================================
// 全局应用状态
// ==========================================
const App = {
  user: null,
  currentGame: null,
  currentChar: null,
  gameState: null,

  async init() {
    await Store.init();
    this._loadUser();
    this._setupNav();
  },

  _loadUser() {
    try {
      const u = localStorage.getItem('uu_current_user');
      if (u) this.user = JSON.parse(u);
    } catch {}
    this._updateNavAuth();
  },

  _updateNavAuth() {
    const loginBtn = document.getElementById('btn-login');
    const userMenu = document.getElementById('user-menu');
    const userName = document.getElementById('user-name-display');
    const navProfile = document.getElementById('nav-profile');
    if (!loginBtn) return; // DOM not ready yet
    if (this.user) {
      loginBtn.style.display = 'none';
      if (userMenu) userMenu.style.display = 'block';
      if (userName) userName.textContent = this.user.nick || this.user.username;
      if (navProfile) navProfile.style.display = 'inline';
    } else {
      loginBtn.style.display = 'inline-flex';
      if (userMenu) userMenu.style.display = 'none';
      if (navProfile) navProfile.style.display = 'none';
    }
  },

  _setupNav() {
    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay').forEach(m => {
          if (m.style.display !== 'none') m.style.display = 'none';
        });
      }
    });
  },

  async login(username, password) {
    const user = await Store.get('users', username);
    if (!user) throw new Error('用户不存在');
    if (user.password !== password) throw new Error('密码错误');
    this.user = user;
    localStorage.setItem('uu_current_user', JSON.stringify(user));
    this._updateNavAuth();
    return user;
  },

  async register(username, password, nick) {
    const existing = await Store.get('users', username);
    if (existing) throw new Error('用户名已存在');
    const user = { username, password, nick: nick || username, created: Date.now() };
    await Store.put('users', user);
    this.user = user;
    localStorage.setItem('uu_current_user', JSON.stringify(user));
    this._updateNavAuth();
    return user;
  },

  logout() {
    this.user = null;
    localStorage.removeItem('uu_current_user');
    this._updateNavAuth();
    Router.go('home');
  },

  async getGames() {
    return await Store.getAll('games') || [];
  },

  async registerGame(gameData) {
    return await Store.put('games', gameData);
  },

  async getCharacters(username) {
    const all = await Store.getAll('characters') || [];
    return all.filter(c => c.username === username);
  },

  async saveCharacter(char) {
    char.username = this.user?.username || 'local';
    return await Store.put('characters', char);
  },

  async getSaves(charId) {
    const all = await Store.getAll('saves') || [];
    return all.filter(s => s.charId === charId).sort((a, b) => b.savedAt - a.savedAt);
  },

  async saveGame(data) {
    data.savedAt = Date.now();
    return await Store.put('saves', data);
  },

  async loadSave(id) {
    return await Store.get('saves', id);
  },

  async deleteSave(id) {
    return await Store.delete('saves', id);
  },

  async deleteGame(slug) {
    return await Store.delete('games', slug);
  }
};

// ==========================================
// UI 工具函数
// ==========================================
function navigate(page, params) { Router.go(page, params); }

function showAuth() {
  const modal = document.getElementById('auth-modal');
  modal.style.display = 'flex';
  document.getElementById('auth-error').style.display = 'none';
  document.getElementById('auth-error').textContent = '';
  switchAuth('login');
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.querySelectorAll('.modal-overlay').forEach(m => {
    if (m) m.style.display = 'none';
  });
}

function closeModalById(id) {
  document.getElementById(id).style.display = 'none';
}

let authMode = 'login';
function switchAuth(mode) {
  authMode = mode;
  document.getElementById('auth-title').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('auth-submit').textContent = mode === 'login' ? '登录' : '注册';
  document.getElementById('reg-nick-group').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('reg-pwd2-group').style.display = mode === 'register' ? 'block' : 'none';
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${mode}`).classList.add('active');
}

async function handleAuth(e) {
  e.preventDefault();
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  const username = document.getElementById('auth-username').value.trim();
  const password = document.getElementById('auth-password').value;
  if (!username || !password) {
    errEl.textContent = '请填写用户名和密码';
    errEl.style.display = 'block'; return;
  }
  try {
    if (authMode === 'login') {
      await App.login(username, password);
    } else {
      const nick = document.getElementById('auth-nick').value.trim() || username;
      const pwd2 = document.getElementById('auth-password2').value;
      if (password !== pwd2) {
        errEl.textContent = '两次密码不一致';
        errEl.style.display = 'block'; return;
      }
      await App.register(username, password, nick);
    }
    closeModal();
    navigate('home');
  } catch(e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  }
}

function logout() {
  App.logout();
}

function formatDate(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// ==========================================
// 启动
// ==========================================
document.addEventListener('DOMContentLoaded', async () => {
  try {
    await App.init();
    await navigate('home');
  } catch(e) {
    console.error('UU模拟器初始化失败:', e);
    // 即使初始化失败，也要显示页面内容
    const loading = document.getElementById('page-loading');
    if (loading) {
      loading.innerHTML = `
        <div style="text-align:center;padding:40px 20px">
          <div style="font-size:48px;margin-bottom:16px">🐉</div>
          <h2>加载遇到点小问题</h2>
          <p style="color:var(--text-muted);margin:12px 0">${e.message || '未知错误'}</p>
          <p style="color:var(--text-muted);font-size:13px">但别担心，核心功能还可以用</p>
          <button class="btn btn-primary" style="margin-top:16px" onclick="navigate('home')">进入首页</button>
        </div>`;
      loading.style.display = 'flex';
    }
  }
});
</script>

<script>/* ========================================
   UU模拟器 - 角色创建器
   ======================================== */

let charCreator = {
  game: null,
  step: 0,
  data: {},
  template: null,
  maxSteps: 5
};

Router.register('character', async (params) => {
  const gameSlug = params.game || 'dragonraja';
  const template = getGameTemplate(gameSlug);
  if (!template) return '<div class="page-content"><h1>游戏模板未找到</h1></div>';

  charCreator = {
    game: gameSlug,
    step: 0,
    data: { name: '', gender: '男', age: 18 },
    template,
    maxSteps: template.createSteps || 5
  };

  return renderCreatorStep();
});

function renderCreatorStep() {
  const c = charCreator;
  const t = c.template;
  const step = c.step;

  const steps = ['基本信息', '血统背景', '属性分配', '言灵选择', '确认创建'];
  const stepNames = t.stepNames || steps;

  return `
  <div class="page-content">
    <div class="page-header">
      <h1>🐉 创建你的角色</h1>
      <p>${t.title} — 塑造属于你的混血种</p>
    </div>

    <div class="creation-steps">
      ${stepNames.map((s, i) => `
        <span class="step ${i === step ? 'active' : ''} ${i < step ? 'done' : ''}">${s}</span>
      `).join('')}
    </div>

    <div class="creation-panel">
      <div class="creation-form">
        ${renderStepContent(step, t, c.data)}
      </div>
      <div class="creation-preview">
        ${renderPreview(c.data, t)}
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;margin-top:24px;max-width:600px;margin-left:auto;margin-right:auto">
      <button class="btn btn-secondary" onclick="prevStep()" ${step === 0 ? 'disabled' : ''}>上一步</button>
      <button class="btn btn-primary" onclick="nextStep()">${step >= c.maxSteps - 1 ? '✨ 创建角色' : '下一步'}</button>
    </div>
  </div>`;
}

function renderStepContent(step, t, data) {
  switch(step) {
    case 0: return renderBasicInfo(t, data);
    case 1: return renderBloodline(t, data);
    case 2: return renderAttributes(t, data);
    case 3: return renderSpirit(t, data);
    case 4: return renderConfirm(t, data);
    default: return '';
  }
}

function renderBasicInfo(t, data) {
  return `
    <h3 style="margin-bottom:16px">📋 基本信息</h3>
    <div class="form-group">
      <label>角色姓名</label>
      <input type="text" id="c-name" value="${data.name || ''}" placeholder="输入你的名字" oninput="updateCharData('name', this.value)">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>性别</label>
        <select id="c-gender" onchange="updateCharData('gender', this.value)">
          ${['男', '女', '其他'].map(g => `<option value="${g}" ${data.gender === g ? 'selected' : ''}>${g}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>年龄</label>
        <input type="number" id="c-age" value="${data.age || 18}" min="16" max="60" oninput="updateCharData('age', parseInt(this.value) || 18)">
      </div>
    </div>
    <div class="form-group">
      <label>外貌特征</label>
      <textarea id="c-appearance" placeholder="描述你的角色外貌..." oninput="updateCharData('appearance', this.value)">${data.appearance || ''}</textarea>
    </div>
    <div class="form-group">
      <label>性格简述</label>
      <textarea id="c-personality" placeholder="冷静、冲动、谨慎、热血..." oninput="updateCharData('personality', this.value)">${data.personality || ''}</textarea>
    </div>
  `;
}

function renderBloodline(t, data) {
  const bloodlines = t.bloodlines || [
    { id: 'bai_de', name: '白王血裔', desc: '白王的后裔，拥有极高的精神属性潜力和强大的言灵天赋', icon: '🤍' },
    { id: 'hei_de', name: '黑王血裔', desc: '黑王的后裔，肉体力量和龙血纯度潜力极高，战斗天赋异禀', icon: '🖤' },
    { id: 'hun_xue', name: '普通混血种', desc: '最常见的混血种，各方面均衡发展，适应性最强', icon: '💜' },
    { id: 'mi_dang', name: '秘党世家', desc: '出身秘党核心家族，从小接受屠龙训练，拥有丰富的知识和人脉', icon: '⚜️' }
  ];

  const backgrounds = t.backgrounds || [
    { id: 'student', name: '普通学生', desc: '在收到卡塞尔通知书前，过着平凡的生活' },
    { id: 'fighter', name: '武术世家', desc: '自幼习武，身体素质远超常人' },
    { id: 'scholar', name: '学术天才', desc: '在历史/语言学方面有惊人的天赋' },
    { id: 'loner', name: '独行者', desc: '在街头长大，靠自己的本能活到现在' }
  ];

  return `
    <h3 style="margin-bottom:16px">🧬 血统与背景</h3>
    <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:8px">选择血统</label>
    <div class="option-grid">
      ${bloodlines.map(b => `
        <div class="option-card ${data.bloodline === b.id ? 'selected' : ''}" onclick="selectCharOption('bloodline', '${b.id}')">
          ${b.icon} ${b.name}
          <div class="opt-desc">${b.desc}</div>
        </div>
      `).join('')}
    </div>
    <div style="margin-top:16px">
      <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:8px">出身背景</label>
      <div class="option-grid">
        ${backgrounds.map(b => `
          <div class="option-card ${data.background === b.id ? 'selected' : ''}" onclick="selectCharOption('background', '${b.id}')">
            ${b.name}
            <div class="opt-desc">${b.desc}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderAttributes(t, data) {
  const baseAttrs = t.attributes || [
    { id: 'str', name: '力量', desc: '物理攻击力与体能', icon: '💪' },
    { id: 'agi', name: '敏捷', desc: '速度与反应', icon: '⚡' },
    { id: 'con', name: '体质', desc: '生命值与抗性', icon: '🛡️' },
    { id: 'int', name: '智力', desc: '知识与推理', icon: '🧠' },
    { id: 'cha', name: '魅力', desc: '社交与领导力', icon: '💎' },
    { id: 'blood', name: '血统纯度', desc: '龙血浓度，影响言灵威力', icon: '🔴' }
  ];
  const pts = data.attrPoints || 18;
  const attrs = data.attributes || {};

  return `
    <h3 style="margin-bottom:16px">⚔️ 属性分配（剩余：<span style="color:var(--accent-gold)" id="attr-pts">${pts}</span> 点）</h3>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:16px">龙族混血种的基础属性，每个属性至少1点，上限10点</p>
    ${baseAttrs.map(a => {
      const val = attrs[a.id] || 1;
      return `
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
          <span style="width:24px;font-size:18px">${a.icon}</span>
          <span style="width:50px;font-size:13px;color:var(--text-secondary)">${a.name}</span>
          <button class="btn btn-sm btn-ghost" onclick="adjustAttr('${a.id}', -1)">−</button>
          <span style="width:24px;text-align:center;font-weight:700;color:var(--accent-gold)" id="attr-${a.id}">${val}</span>
          <button class="btn btn-sm btn-ghost" onclick="adjustAttr('${a.id}', 1)">+</button>
          <span style="font-size:12px;color:var(--text-muted)">${a.desc}</span>
        </div>
      `;
    }).join('')}
  `;
}

function renderSpirit(t, data) {
  const spirits = t.spiritWords || [
    { id: 'sword', name: '剑御·天羽羽斩', type: '攻击型', desc: '召唤无数利刃攻击敌人，血统纯度越高，剑阵越强', icon: '🗡️' },
    { id: 'flame', name: '炽·君焰', type: '攻击型', desc: '操控火焰的力量，可释放高温烈焰焚烧一切', icon: '🔥' },
    { id: 'time', name: '时隙·时间零', type: '辅助型', desc: '感知和时间流速的变化，让自己进入超加速状态', icon: '⏳' },

// 全局函数
window.updateCharData = function(key, val) {
  charCreator.data[key] = val;
};

window.selectCharOption = function(key, val) {
  charCreator.data[key] = val;
  renderCharPreview();
};

window.adjustAttr = function(attrId, delta) {
  const data = charCreator.data;
  if (!data.attributes) data.attributes = {};
  if (!data.attrPoints && data.attrPoints !== 0) data.attrPoints = 18;
  const current = data.attributes[attrId] || 1;
  const newVal = current + delta;
  if (newVal < 1 || newVal > 10) return;
  if (delta > 0 && data.attrPoints <= 0) return;
  if (delta < 0 && current <= 1) return;
  data.attributes[attrId] = newVal;
  data.attrPoints += delta < 0 ? 1 : -1;
  renderCharPreview();
};

window.prevStep = function() {
  if (charCreator.step > 0) {
    charCreator.step--;
    refreshCreator();
  }
};

window.nextStep = function() {
  const step = charCreator.step;
  const data = charCreator.data;

  if (step === 0 && !data.name) { alert('请填写角色姓名'); return; }
  if (step === 1 && !data.bloodline) { alert('请选择血统'); return; }
  if (step === 2) {
    if (!data.attributes) data.attributes = {};
    const attrIds = ['str', 'agi', 'con', 'int', 'cha', 'blood'];
    attrIds.forEach(id => { if (!data.attributes[id]) data.attributes[id] = 1; });
    if (!data.attrPoints) data.attrPoints = 18;
  }
  if (step === 3 && !data.spirit) { alert('请选择言灵'); return; }

  if (step >= charCreator.maxSteps - 1) {
    finishCharacter();
    return;
  }
  charCreator.step++;
  refreshCreator();
};

function refreshCreator() {
  const main = document.getElementById('main-content');
  const page = document.getElementById('page-character');
  if (page) page.innerHTML = renderCreatorStep();
}

function renderCharPreview() {
  const main = document.getElementById('main-content');
  // Simple re-render of preview panel
  const preview = document.querySelector('.creation-preview');
  if (preview) {
    preview.innerHTML = renderPreview(charCreator.data, charCreator.template);
  }
  // Update attribute display
  if (charCreator.data.attributes) {
    Object.entries(charCreator.data.attributes).forEach(([k, v]) => {
      const el = document.getElementById(`attr-${k}`);
      if (el) el.textContent = v;
    });
  }
  const ptsEl = document.getElementById('attr-pts');
  if (ptsEl) ptsEl.textContent = charCreator.data.attrPoints || 0;
}

async function finishCharacter() {
  const data = charCreator.data;
  if (!data.attributes) {
    data.attributes = {};
    ['str','agi','con','int','cha','blood'].forEach(a => data.attributes[a] = data.attributes[a] || 1);
  }
  const char = {
    ...data,
    game: charCreator.game,
    createdAt: Date.now(),
    level: 1,
    exp: 0,
    hp: 50 + (data.attributes?.con || 1) * 5,
    maxHp: 50 + (data.attributes?.con || 1) * 5,
    location: '开局',
    inventory: [],
    flags: [],
    relationships: {},
    storyLog: []
  };

  await App.saveCharacter(char);
  App.currentChar = char;
  enterGame(char);
}

function enterGame(char) {
  Router.go('game', { charId: char.id || 'new' });
}

function getGameTemplate(slug) {
  const templates = {
    dragonraja: typeof DRAGONRAJA !== 'undefined' ? DRAGONRAJA.template : null
  };
  return templates[slug];
}
</script>
<script>/* ========================================
   UU模拟器 - 游戏引擎
   叙事引擎 + TRPG战斗系统 + 状态管理
   ======================================== */

const GameEngine = {
  char: null,
  template: null,
  state: null,
  currentSaveId: null,
  autoSaveTimer: null,

  async init(char, template) {
    this.char = char;
    this.template = template;
    this.state = {
      location: char.location || template.startLocation || 'start',
      chapter: 1,
      scene: 'intro',
      hp: char.hp || 50,
      maxHp: char.maxHp || 50,
      sp: 10,
      maxSp: 10,
      inventory: char.inventory || [],
      flags: char.flags || [],
      relationships: char.relationships || {},
      storyLog: char.storyLog || [],
      combat: null,
      choices: [],
      narrative: '',
      turn: 0
    };
    // Start auto-save
    this._startAutoSave();
    return this;
  },

  _startAutoSave() {
    if (this.autoSaveTimer) clearInterval(this.autoSaveTimer);
    this.autoSaveTimer = setInterval(() => {
      if (this.char) this.autoSave();
    }, 60000); // Auto save every 60 seconds
  },

  // ==========================================
  // 叙事引擎
  // ==========================================

  async startScene(sceneId) {
    const template = this.template;
    const scene = template.scenes?.[sceneId] || template.scenes?.['start'];
    if (!scene) {
      return this._generateAIScene(sceneId);
    }

    this.state.location = scene.location || this.state.location;
    this.state.scene = sceneId;

    let narrative = this._renderText(scene.narrative || '');
    
    // Check for combat
    if (scene.combat) {
      this.startCombat(scene.combat);
    }

    // Build choices
    let choices = [];
    if (scene.choices) {
      choices = scene.choices
        .filter(c => this._checkConditions(c.conditions))
        .map(c => ({
          id: c.id || Math.random().toString(36).slice(2, 8),
          text: this._renderText(c.text),
          hint: c.hint ? this._renderText(c.hint) : '',
          next: c.next,
          effects: c.effects || {},
          combat: c.combat || null,
          check: c.check || null
        }));
    }

    // Apply automatic effects
    this._applyEffects(scene.effects);

    this.state.narrative = narrative;
    this.state.choices = choices;
    this.state.turn++;
    this.state.storyLog.push({ turn: this.state.turn, scene: sceneId, narrative: narrative.slice(0, 100) });

    return { narrative, choices, state: this._getState() };
  },

  async makeChoice(choiceId) {
    const choice = this.state.choices.find(c => c.id === choiceId);
    if (!choice) throw new Error('无效的选择');

    // Apply effects
    this._applyEffects(choice.effects);

    // Skill check
    if (choice.check) {
      const result = this._skillCheck(choice.check);
      this.state.narrative += `\n\n[检定: ${choice.check.attr}] 掷出 ${result.roll} + ${result.modifier} = ${result.total}，目标值 ${result.dc} — ${result.success ? '✅ 成功' : '❌ 失败'}`;
      if (choice.check.failNext && !result.success) {
        return this.startScene(choice.check.failNext);
      }
    }

    // Start combat
    if (choice.combat) {
      this.startCombat(choice.combat);
      return this._renderState();
    }

    // Go to next scene
    if (choice.next) {
      return this.startScene(choice.next);
    }

    // Fallback: generate AI scene
    return this._generateAIScene(`after_${choiceId}`);
  },

  // ==========================================
  // TRPG战斗系统 (D20)
  // ==========================================

  startCombat(combatConfig) {
    const enemies = combatConfig.enemies || [];
    this.state.combat = {
      active: true,
      turn: 0,
      round: 1,
      enemies: enemies.map(e => ({
        ...e,
        currentHp: e.hp || 20,
        maxHp: e.hp || 20,
        status: 'alive'
      })),
      log: ['⚔️ 战斗开始！'],
      playerAction: null,
      enemyTarget: null,
      isPlayerTurn: true
    };
  },

  performAction(action, targetId) {
    if (!this.state.combat) return null;
    const combat = this.state.combat;
    const char = this.char;
    const attrs = char.attributes || {};
    let result = { log: [], effects: {} };

    // Roll initiative
    if (combat.turn === 0) {
      const ini = this._d20() + Math.floor((attrs.agi || 1) / 2);
      const eIni = this._d20() + 5;
      combat.isPlayerTurn = ini >= eIni;
      combat.log.push(`🎲 先攻检定: 你(${ini}) vs 敌人(${eIni}) — ${combat.isPlayerTurn ? '你先手' : '敌人先手'}`);
      combat.turn = 1;
      if (!combat.isPlayerTurn) return this._enemyTurn();
    }

    switch(action) {
      case 'attack': {
        const enemy = combat.enemies.find(e => e.id === targetId && e.status === 'alive');
        if (!enemy) return null;
        const roll = this._d20();
        const mod = Math.floor((attrs.str || 1) / 2);
        const total = roll + mod;
        const ac = enemy.ac || 10;
        const hit = total >= ac;
        
        let dmg = 0;
        let log = `🎯 攻击 ${enemy.name}: 掷出 ${roll} + ${mod} = ${total} vs AC ${ac} — ${hit ? '命中！' : '未命中'}`;
        
        if (hit) {
          dmg = this._d20(6) + Math.floor((attrs.str || 1) / 3);
          if (roll === 20) { dmg *= 2; log += ' 💥 暴击！'; }
          enemy.currentHp = Math.max(0, enemy.currentHp - dmg);
          log += ` 造成 ${dmg} 点伤害`;
          if (enemy.currentHp <= 0) {
            enemy.status = 'dead';
            log += ` 💀 ${enemy.name} 被击败！`;
          }
        }
        combat.log.push(log);
        result.log.push(log);
        break;
      }
      case 'spirit': {
        // Use spirit word (言灵)
        const spCost = 3;
        if (this.state.sp < spCost) {
          combat.log.push('❌ 灵力不足，无法使用言灵');
          return null;
        }
        this.state.sp -= spCost;
        const enemy = combat.enemies.find(e => e.id === targetId && e.status === 'alive');
        if (!enemy) return null;
        const roll = this._d20();
        const mod = Math.floor((attrs.int || 1) / 2) + Math.floor((attrs.blood || 1) / 2);
        const total = roll + mod;
        const dc = 8 + (enemy.mdef || 5);
        const hit = total >= dc;
        
        let dmg = 0;
        let log = `🔮 言灵释放: 掷出 ${roll} + ${mod} = ${total} vs DC ${dc} — ${hit ? '成功' : '失败'}`;
        
        if (hit) {
          dmg = this._d20(8) + Math.floor((attrs.blood || 1) / 2);
          if (roll >= 18) { dmg = Math.floor(dmg * 1.5); log += ' ✨ 言灵共鸣！'; }
          enemy.currentHp = Math.max(0, enemy.currentHp - dmg);
          log += ` 造成 ${dmg} 点精神伤害`;
          if (enemy.currentHp <= 0) {
            enemy.status = 'dead';
            log += ` 💀 ${enemy.name} 被击败！`;
          }
        }
        combat.log.push(log);
        result.log.push(log);
        break;
      }
      case 'defend': {
        const heal = this._d20(4) + Math.floor((attrs.con || 1) / 3);
        this.state.hp = Math.min(this.state.maxHp, this.state.hp + heal);
        combat.log.push(`🛡️ 防御姿态: 恢复 ${heal} HP (当前 ${this.state.hp}/${this.state.maxHp})`);
        result.log.push(`防御恢复 ${heal} HP`);
        break;
      }
      case 'flee': {
        const roll = this._d20();
        const mod = Math.floor((attrs.agi || 1) / 2);
        const success = roll + mod > 12;
        combat.log.push(`🏃 试图逃跑: 掷出 ${roll} + ${mod} = ${roll + mod} — ${success ? '成功逃脱' : '逃跑失败'}`);
        if (success) {
          combat.active = false;
          combat.log.push('✅ 你成功脱离了战斗');
          return { type: 'flee_success', log: ['成功逃离战斗'] };
        }
        return null;
      }
    }

    // Check if all enemies dead
    const alive = combat.enemies.filter(e => e.status === 'alive');
    if (alive.length === 0) {
      combat.active = false;
      combat.log.push('🏆 战斗胜利！');
      result.log.push('🏆 战斗胜利！');
      // Reward
      const exp = combat.enemies.reduce((sum, e) => sum + (e.expReward || 10), 0);
      this.char.exp = (this.char.exp || 0) + exp;
      result.effects.expGain = exp;
      this.state.combat = null;
      return { type: 'victory', ...result };
    }

    // Enemy turn
    return this._enemyTurn();
  },

  _enemyTurn() {
    const combat = this.state.combat;
    if (!combat || !combat.active) return null;

    const alive = combat.enemies.filter(e => e.status === 'alive');
    const result = { log: [], effects: {} };

    alive.forEach(enemy => {
      const roll = this._d20();
      const atk = enemy.atk || 5;
      const total = roll + atk;
      const ac = 10 + Math.floor((this.char.attributes?.agi || 1) / 2);
      const hit = total >= ac;
      
      let log = `👹 ${enemy.name} 攻击: 掷出 ${roll} + ${atk} = ${total} vs AC ${ac} — ${hit ? '命中！' : '未命中'}`;
      
      if (hit) {
        const dmg = this._d20(6) + Math.floor(atk / 2);
        this.state.hp = Math.max(0, this.state.hp - dmg);
        log += ` 受到 ${dmg} 点伤害 (剩余 ${this.state.hp}/${this.state.maxHp})`;
        
        if (this.state.hp <= 0) {
          log += ' 💀 你被击倒了...';
          this.state.combat.active = false;
          this.state.combat = null;
          result.log.push(log);
          return { type: 'defeat', log: result.log };
        }
      }
      combat.log.push(log);
      result.log.push(log);
    });

    combat.round++;
    combat.isPlayerTurn = true;
    return { type: 'enemy_turn_end', ...result };
  },

  // ==========================================
  // 工具函数
  // ==========================================

  _d20(sides = 20) {
    return Math.floor(Math.random() * sides) + 1;
  },

  _skillCheck(check) {
    const attr = check.attr || 'str';
    const dc = check.dc || 10;
    const roll = this._d20();
    const modifier = Math.floor((this.char.attributes?.[attr] || 1) / 2);
    const total = roll + modifier;
    return { roll, modifier, total, dc, success: total >= dc };
  },

  _checkConditions(conditions) {
    if (!conditions) return true;
    const flags = this.state.flags;
    const rels = this.state.relationships;
    
    if (conditions.flag) return flags.includes(conditions.flag);
    if (conditions.noFlag) return !flags.includes(conditions.noFlag);
    if (conditions.attr) {
      const [attr, op, val] = conditions.attr.split(/\s+/);
      const actual = this.char.attributes?.[attr] || 1;
      if (op === '>=') return actual >= parseInt(val);
      if (op === '<=') return actual <= parseInt(val);
      if (op === '>') return actual > parseInt(val);
      if (op === '<') return actual < parseInt(val);
      if (op === '==') return actual === parseInt(val);
    }
    if (conditions.affection) {
      const [npc, op, val] = conditions.affection.split(/\s+/);
      const actual = rels[npc] || 0;
      if (op === '>=') return actual >= parseInt(val);
      if (op === '>') return actual > parseInt(val);
    }
    if (conditions.item) return this.state.inventory.includes(conditions.item);
    if (conditions.noItem) return !this.state.inventory.includes(conditions.noItem);
    return true;
  },

  _applyEffects(effects) {
    if (!effects) return;
    if (effects.flag) this.state.flags.push(effects.flag);
    if (effects.removeFlag) {
      this.state.flags = this.state.flags.filter(f => f !== effects.removeFlag);
    }
    if (effects.item) {
      if (!this.state.inventory.includes(effects.item)) this.state.inventory.push(effects.item);
    }
    if (effects.removeItem) {
      this.state.inventory = this.state.inventory.filter(i => i !== effects.removeItem);
    }
    if (effects.hp) {
      this.state.hp = Math.max(0, Math.min(this.state.maxHp, this.state.hp + effects.hp));
    }
    if (effects.sp) {
      this.state.sp = Math.max(0, Math.min(this.state.maxSp, this.state.sp + effects.sp));
    }
    if (effects.exp) {
      this.char.exp = (this.char.exp || 0) + effects.exp;
    }
    if (effects.affection) {
      Object.entries(effects.affection).forEach(([npc, val]) => {
        this.state.relationships[npc] = (this.state.relationships[npc] || 0) + val;
      });
    }
    if (effects.setAffection) {
      Object.entries(effects.setAffection).forEach(([npc, val]) => {
        this.state.relationships[npc] = val;
      });
    }
    if (effects.location) {
      this.state.location = effects.location;
    }
    if (effects.chapter) {
      this.state.chapter = effects.chapter;
    }
  },

  _renderText(text) {
    if (!text) return '';
    return text
      .replace(/{name}/g, this.char?.name || '你')
      .replace(/{gender}/g, this.char?.gender === '女' ? '她' : '他')
      .replace(/{self}/g, this.char?.gender === '女' ? '你' : '你')
      .replace(/{bloodline}/g, this.char?.bloodline || '混血种')
      .replace(/{spirit}/g, this._getSpiritName())
      .replace(/{location}/g, this.state?.location || '未知');
  },

  _getSpiritName() {
    const names = {
      sword: '天羽羽斩', flame: '君焰', time: '时间零',
      thunder: '雷池', soul: '审判', shield: '无尘之地'
    };
    return names[this.char?.spirit] || '未知言灵';
  },

  _getState() {
    return {
      hp: this.state.hp,
      maxHp: this.state.maxHp,
      sp: this.state.sp,
      maxSp: this.state.maxSp,
      location: this.state.location,
      chapter: this.state.chapter,
      scene: this.state.scene,
      turn: this.state.turn,
      inventory: [...this.state.inventory],
      flags: [...this.state.flags],
      relationships: { ...this.state.relationships },
      attribtues: { ...(this.char.attributes || {}) },
      exp: this.char.exp || 0,
      level: this.char.level || 1,
      combat: this.state.combat ? { ...this.state.combat, log: [...this.state.combat.log] } : null
    };
  },

  _generateAIScene(sceneId) {
    // Placeholder for AI-generated scenes
    // When AI generation is triggered, this returns a format that the user imports
    return {
      type: 'ai_needed',
      sceneId: sceneId,
      context: {
        location: this.state.location,
        flags: this.state.flags,
        relationships: this.state.relationships,
        char: { name: this.char.name, attributes: this.char.attributes, bloodline: this.char.bloodline }
      },
      narrative: '[AI生成区域] 这段剧情需要我（AI）来生成。请告诉我你当前的选择，我来写接下来的故事。',
      choices: [
        { id: 'ai_wait', text: '等待AI生成剧情...', hint: '在聊天中告诉我你的行动', next: null }
      ]
    };
  },

  // ==========================================
  // 存档系统
  // ==========================================

  async save(slotName) {
    const saveData = {
      id: this.currentSaveId || `save_${Date.now()}`,
      charId: this.char.id,
      slotName: slotName || `存档 ${formatDate(Date.now())}`,
      char: { ...this.char },
      state: { ...this.state, storyLog: this.state.storyLog.slice(-50) },
      savedAt: Date.now(),
      chapter: this.state.chapter,
      location: this.state.location,
      turn: this.state.turn
    };
    if (!this.currentSaveId) {
      this.currentSaveId = saveData.id;
    }
    await App.saveGame(saveData);
    return saveData;
  },

  async autoSave() {
    if (!this.char) return;
    const saves = await App.getSaves(this.char.id);
    const autoSaves = saves.filter(s => s.slotName?.startsWith('[自动]'));
    // Keep only 5 auto saves
    if (autoSaves.length >= 5) {
      const oldest = autoSaves.sort((a, b) => a.savedAt - b.savedAt)[0];
      await App.deleteSave(oldest.id);
    }
    const saveData = {
      id: `auto_${Date.now()}`,
      charId: this.char.id,
      slotName: `[自动] 第${this.state.chapter}章 - ${formatDate(Date.now())}`,
      char: { ...this.char },
      state: { ...this.state, storyLog: this.state.storyLog.slice(-30) },
      savedAt: Date.now(),
      chapter: this.state.chapter,
      location: this.state.location
    };
    await App.saveGame(saveData);
  },

  async load(saveId) {
    const data = await App.loadSave(saveId);
    if (!data) throw new Error('存档未找到');
    this.char = data.char;
    this.state = data.state;
    this.currentSaveId = data.id;
    return this._renderState();
  }
};

function renderNarrative(result) {
  if (!result) return '<div class="system-msg">加载中...</div>';
  
  let html = '<div class="narrative-text">';
  
  // Location tag
  if (result.narrative) {
    html += `<span class="location-tag">📍 ${GameEngine.state?.location || ''}</span>\n\n`;
    
    // Parse narrative for special tags
    let text = result.narrative;
    // Highlight NPC names (Chinese characters followed by : or said patterns)
    text = text.replace(/(路明非|楚子航|凯撒|诺诺|昂热|芬里厄|夏弥|源稚生|绘梨衣)/g, '<span class="npc-name">$1</span>');
    // Highlight item names
    text = text.replace(/《([^》]+)》/g, '<span class="item-name">《$1》</span>');
    // System messages
    text = text.replace(/\[系统\]/g, '<span class="system-msg">[系统]</span>');
    
    html += text.replace(/\n/g, '<br>');
  }
  
  // Combat state
  if (GameEngine.state?.combat?.active) {
    const combat = GameEngine.state.combat;
    html += `
    <div class="combat-overlay">
      <div class="combat-title">⚔️ 战斗中</div>
      <div class="combat-stats">
        <div class="combatant">
          <div class="name">${GameEngine.char.name}</div>
          <div class="hp-bar"><div class="hp-fill" style="width:${(GameEngine.state.hp/GameEngine.state.maxHp)*100}%"></div></div>
          <div style="font-size:12px;color:var(--text-muted)">${GameEngine.state.hp}/${GameEngine.state.maxHp} HP</div>
        </div>
        ${combat.enemies.filter(e => e.status === 'alive').map(e => `
          <div class="combatant">
            <div class="name" style="color:var(--accent-red)">${e.name}</div>
            <div class="hp-bar"><div class="hp-fill" style="width:${(e.currentHp/e.maxHp)*100}%;background:var(--accent-red)"></div></div>
            <div style="font-size:12px;color:var(--text-muted)">${e.currentHp}/${e.maxHp} HP</div>
          </div>
        `).join('')}
      </div>
      <div class="combat-log-area">
        ${combat.log.slice(-5).map(l => `<div class="${l.includes('命中') || l.includes('暴击') ? 'success' : l.includes('未命中') || l.includes('失败') ? 'failure' : ''}">${l}</div>`).join('')}
      </div>
      ${combat.isPlayerTurn ? `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
          <button class="btn btn-primary btn-sm" onclick="combatAction('attack', '${combat.enemies.filter(e=>e.status==='alive')[0]?.id || ''}')">⚔️ 攻击</button>
          <button class="btn btn-secondary btn-sm" onclick="combatAction('spirit', '${combat.enemies.filter(e=>e.status==='alive')[0]?.id || ''}')">🔮 言灵</button>
          <button class="btn btn-secondary btn-sm" onclick="combatAction('defend', '')">🛡️ 防御</button>
          <button class="btn btn-secondary btn-sm" onclick="combatAction('flee', '')">🏃 逃跑</button>
        </div>
      ` : '<p style="text-align:center;color:var(--text-muted)">等待敌人行动...</p>'}
    </div>`;
  }
  
  html += '</div>';
  return html;
}

function renderChoices(result) {
  if (!result?.choices || result.choices.length === 0) {
    return '<p style="color:var(--text-muted);font-size:13px">等待AI剧情...</p>';
  }
  
  return result.choices.map(c => `
    <button class="btn-choice" onclick="selectChoice('${c.id}')">
      ${c.text}
      ${c.hint ? `<span class="hint">${c.hint}</span>` : ''}
    </button>
  `).join('');
}

function renderMap(currentLocation) {
  const locations = GameEngine.template?.locations || {};
  const locs = Object.values(locations);
  if (locs.length === 0) return '<div style="font-size:12px;color:var(--text-muted)">暂无地图数据</div>';
  
  return locs.map(l => `
    <div class="map-location ${l.id === currentLocation ? 'current' : ''} ${GameEngine.state.flags.includes(`visited_${l.id}`) ? 'visited' : 'locked'}">
      ${l.icon || '📍'} ${l.name}
    </div>
  `).join('');
}

window.selectChoice = async function(choiceId) {
  try {
    const result = await GameEngine.makeChoice(choiceId);
    // Re-render game UI
    const main = document.getElementById('game-main');
    if (main) {
      // Update narrative
      const na = document.getElementById('narrative-area');
      const ca = document.getElementById('choices-area');
      if (na) na.innerHTML = renderNarrative(result);
      if (ca) ca.innerHTML = renderChoices(result);
      // Update sidebar stats
      updateSidebar();
    } else {
      // Full re-render
      const page = document.getElementById('page-game');
      if (page) page.innerHTML = renderGameUI(result);
    }
  } catch(e) {
    alert('操作失败: ' + e.message);
  }
};

window.combatAction = async function(action, targetId) {
  try {
    const result = GameEngine.performAction(action, targetId);
    const na = document.getElementById('narrative-area');
    const ca = document.getElementById('choices-area');
    if (na) na.innerHTML = renderNarrative({ narrative: '', choices: [] });
    updateSidebar();
    
    // Check combat end
    if (result?.type === 'victory' || result?.type === 'defeat' || result?.type === 'flee_success') {
      // Return to narrative
      const nextResult = await GameEngine.startScene(GameEngine.state.scene || 'start');
      if (na) na.innerHTML = renderNarrative(nextResult);
      if (ca) ca.innerHTML = renderChoices(nextResult);
    }
  } catch(e) {
    console.error(e);
  }
};

window.importAIContent = function() {
  const ta = document.getElementById('ai-import-text');
  if (!ta || !ta.value.trim()) {
    alert('请先粘贴AI生成的剧情数据包');
    return;
  }
  
  try {
    const data = JSON.parse(ta.value.trim());
    // Apply the AI-generated content
    if (data.narrative) {
      GameEngine.state.narrative = data.narrative;
    }
    if (data.choices) {
      GameEngine.state.choices = data.choices;
    }
    if (data.effects) {
      GameEngine._applyEffects(data.effects);
    }
    if (data.state) {
      Object.assign(GameEngine.state, data.state);
    }
    
    const result = {
      narrative: data.narrative || '剧情已更新',
      choices: data.choices || []
    };
    
    const na = document.getElementById('narrative-area');
    const ca = document.getElementById('choices-area');
    if (na) na.innerHTML = renderNarrative(result);
    if (ca) ca.innerHTML = renderChoices(result);
    updateSidebar();
    closeModalById('save-modal');
    alert('✅ AI剧情已导入');
  } catch(e) {
    alert('格式错误，请确保是有效的JSON数据。错误: ' + e.message);
  }
};

function closeGame() {
  if (!confirm('退出游戏？进度将自动保存。')) return;
  GameEngine.autoSave();
  navigate('lobby');
}
</script>
<script>/* ========================================
   UU模拟器 - 创作工坊 & AI导入工具
   ======================================== */

Router.register('creator', async () => {
  if (!App.user) {
    return `
    <div class="page-content" style="text-align:center;padding-top:80px">
      <h1>🔧 创作工坊</h1>
      <p style="color:var(--text-secondary);margin:16px 0">登录后即可创建和编辑游戏模板</p>
      <button class="btn btn-primary" onclick="showAuth()">登录</button>
    </div>`;
  }

  const games = await App.getGames();
  return `
  <div class="page-content">
    <div class="page-header">
      <h1>🔧 创作工坊</h1>
      <p>创建你的游戏模板，或导入AI生成的内容</p>
    </div>

    <div style="display:flex;gap:12px;margin-bottom:24px">
      <button class="btn btn-primary" onclick="showNewTemplate()">✨ 新建模板</button>
      <button class="btn btn-secondary" onclick="showImportAI()">🤖 AI导入</button>
      <button class="btn btn-secondary" onclick="showTemplateGuide()">📖 模板指南</button>
    </div>

    <h3 style="margin-bottom:12px">已安装的游戏模板</h3>
    <div class="featured-grid">
      <div class="game-card">
        <div class="game-card-banner" style="background:linear-gradient(135deg,#1a0a2e,#2a1a1a)">
          <span style="font-size:64px">🐉</span>
          <div class="overlay"></div>
        </div>
        <div class="game-card-body">
          <h3>龙族：火之晨曦</h3>
          <p style="font-size:12px;color:var(--text-muted)">内置 · 62KB · 场景节点40+</p>
          <p>卡塞尔学院、混血种、龙王……忠实于江南原著的龙族冒险。</p>
        </div>
      </div>
      ${games.filter(g => g.slug !== 'dragonraja').map(g => `
        <div class="game-card">
          <div class="game-card-body">
            <h3>${g.title}</h3>
            <p>${g.desc}</p>
          </div>
          <div class="game-card-meta">
            <span>自定义模板</span>
            <button class="btn btn-sm btn-ghost" onclick="deleteGame('${g.slug}')">删除</button>
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
});

window.showNewTemplate = function() {
  const modal = document.getElementById('save-modal');
  const title = document.getElementById('save-modal-title');
  const body = document.getElementById('save-modal-body');
  title.textContent = '✨ 新建游戏模板';
  body.innerHTML = `
    <form onsubmit="createTemplate(event)">
      <div class="form-group">
        <label>模板标识 (slug)</label>
        <input type="text" id="t-slug" placeholder="my-game" required>
      </div>
      <div class="form-group">
        <label>游戏标题</label>
        <input type="text" id="t-title" placeholder="我的游戏" required>
      </div>
      <div class="form-group">
        <label>描述</label>
        <textarea id="t-desc" placeholder="描述你的游戏..."></textarea>
      </div>
      <div class="form-group">
        <label>模板JSON数据</label>
        <textarea id="t-data" placeholder='{\n  "scenes": {},\n  "locations": {},\n  "npcs": {}\n}' style="min-height:300px;font-family:var(--font-mono);font-size:12px"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-full">创建模板</button>
    </form>
  `;
  modal.style.display = 'flex';
};

window.createTemplate = async function(e) {
  e.preventDefault();
  const slug = document.getElementById('t-slug').value.trim();
  const title = document.getElementById('t-title').value.trim();
  const desc = document.getElementById('t-desc').value.trim();
  const dataStr = document.getElementById('t-data').value.trim();
  
  if (!slug || !title) { alert('请填写必要信息'); return; }
  
  let templateData;
  try {
    templateData = dataStr ? JSON.parse(dataStr) : {};
  } catch(e) {
    alert('JSON格式错误: ' + e.message);
    return;
  }
  
  const gameData = {
    slug,
    title,
    desc: desc || '自定义游戏模板',
    tags: ['自定义'],
    banner: '🎮',
    rating: 0,
    author: App.user?.nick || App.user?.username,
    template: templateData,
    created: Date.now()
  };
  
  await App.registerGame(gameData);
  alert('✅ 模板创建成功！');
  closeModalById('save-modal');
  navigate('creator');
};

window.showImportAI = function() {
  const state = GameEngine?.state;
  const char = GameEngine?.char;
  
  const contextStr = state ? JSON.stringify({
    location: state.location,
    chapter: state.chapter,
    flags: state.flags,
    relationships: state.relationships,
    inventory: state.inventory,
    char: { name: char?.name, attributes: char?.attributes, bloodline: char?.bloodline }
  }, null, 2) : '{}';

  const modal = document.getElementById('save-modal');
  const title = document.getElementById('save-modal-title');
  const body = document.getElementById('save-modal-body');
  title.textContent = '🤖 AI剧情导入/导出';
  body.innerHTML = `
    <p style="margin-bottom:12px;color:var(--text-secondary);font-size:13px">
      将当前游戏状态导出，发送给我（AI）生成剧情，再把结果粘贴回来。
    </p>
    
    <div style="margin-bottom:16px">
      <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">当前状态（可复制发送给AI）</label>
      <textarea id="ai-export-data" readonly style="width:100%;min-height:120px;padding:12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-mono);font-size:12px">${contextStr}</textarea>
      <button class="btn btn-sm btn-secondary" style="margin-top:6px" onclick="copyAIData()">📋 复制状态</button>
    </div>

    <div>
      <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:6px">粘贴AI生成的剧情JSON</label>
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:8px">
        格式: {"narrative": "剧情文本", "choices": [{"id":"c1","text":"选项1"}], "effects": {"flag":"xxx", "affection": {"NPC":5}}}
      </p>
      <textarea id="ai-import-data" style="width:100%;min-height:200px;padding:12px;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-family:var(--font-mono);font-size:12px" placeholder='在这里粘贴我生成的JSON数据包...'></textarea>
    </div>
    
    <div class="import-actions" style="margin-top:12px">
      <button class="btn btn-primary btn-sm" onclick="importAIContent()">📥 导入剧情</button>
      <button class="btn btn-sm btn-ghost" onclick="closeModalById('save-modal')">取消</button>
    </div>

    <div style="margin-top:20px;padding:16px;background:var(--bg-card);border-radius:var(--radius-md)">
      <h4 style="font-size:14px;margin-bottom:8px">📌 使用说明</h4>
      <ol style="font-size:12px;color:var(--text-secondary);line-height:1.8;padding-left:20px">
        <li>点击「复制状态」，将当前游戏状态粘贴到对话中发给我</li>
        <li>告诉我你想做什么，我生成后续剧情+选项+状态变更</li>
        <li>我把结果以JSON格式发给你，你粘贴到上面的输入框</li>
        <li>点击「导入剧情」，游戏自动更新</li>
      </ol>
    </div>
  `;
  modal.style.display = 'flex';
};

window.copyAIData = function() {
  const ta = document.getElementById('ai-export-data');
  if (ta) {
    ta.select();
    document.execCommand('copy');
    alert('✅ 已复制。请在对话中粘贴并发给我，我来生成下一段剧情。');
  }
};

window.importAIContent = function() {
  const ta = document.getElementById('ai-import-data');
  if (!ta || !ta.value.trim()) {
    alert('请先粘贴AI生成的剧情JSON数据包');
    return;
  }
  
  try {
    const data = JSON.parse(ta.value.trim());
    
    if (!GameEngine || !GameEngine.state) {
      alert('请先开始游戏再导入剧情');
      return;
    }
    
    // Apply narrative
    if (data.narrative) {
      GameEngine.state.narrative = data.narrative;
    }
    
    // Apply choices
    if (data.choices) {
      GameEngine.state.choices = data.choices;
    }
    
    // Apply effects
    if (data.effects) {
      GameEngine._applyEffects(data.effects);
    }
    
    // Apply state overrides
    if (data.state) {
      Object.assign(GameEngine.state, data.state);
    }
    
    // Re-render
    const result = {
      narrative: data.narrative || GameEngine.state.narrative || '剧情已更新',
      choices: data.choices || GameEngine.state.choices || []
    };
    
    const na = document.getElementById('narrative-area');
    const ca = document.getElementById('choices-area');
    if (typeof renderNarrative === 'function' && na) na.innerHTML = renderNarrative(result);
    if (typeof renderChoices === 'function' && ca) ca.innerHTML = renderChoices(result);
    
    // Auto-save
    GameEngine.autoSave();
    
    closeModalById('save-modal');
    alert('✅ AI剧情已成功导入！游戏状态已更新。');
  } catch(e) {
    alert('❌ 格式错误：' + e.message + '\n\n请确保粘贴的是有效的JSON格式。');
  }
};

window.showTemplateGuide = function() {
  const modal = document.getElementById('save-modal');
  const title = document.getElementById('save-modal-title');
  const body = document.getElementById('save-modal-body');
  title.textContent = '📖 模板开发指南';
  body.innerHTML = `
    <div style="font-size:13px;line-height:1.8;color:var(--text-secondary)">
      <h4 style="color:var(--text-primary);margin-bottom:8px">模板结构</h4>
      <pre style="background:var(--bg-input);padding:12px;border-radius:var(--radius-sm);font-size:12px;overflow-x:auto">
{
  "template": {
    "slug": "my-game",
    "title": "我的游戏",
    "description": "...",
    "startLocation": "start",
    
    "bloodlines": [{ "id": "xxx", "name": "...", "desc": "..." }],
    "backgrounds": [{ "id": "xxx", "name": "...", "desc": "..." }],
    "attributes": [{ "id": "str", "name": "力量", "desc": "..." }],
    "spiritWords": [{ "id": "xxx", "name": "...", "type": "攻击型", "desc": "..." }],
    
    "locations": {
      "start": { "id": "start", "name": "起点", "icon": "📍", "desc": "..." }
    },
    
    "npcs": {
      "npc1": { "id": "npc1", "name": "...", "title": "...", "desc": "..." }
    }
  },
  
  "scenes": {
    "start": {
      "id": "start",
      "chapter": 1,
      "location": "start",
      "narrative": "故事从这里开始...",
      "effects": { "flag": "started" },
      "choices": [
        { 
          "text": "选项A",
          "next": "scene_a",
          "effects": { "flag": "chose_a" }
        }
      ]
    }
  }
}
      </pre>

      <h4 style="color:var(--text-primary);margin:16px 0 8px">场景节点字段</h4>
      <ul style="padding-left:20px">
        <li><b>id</b> — 场景唯一标识</li>
        <li><b>chapter</b> — 章节编号</li>
        <li><b>location</b> — 对应locations中的id</li>
        <li><b>narrative</b> — 叙事文本，支持{name}等变量</li>
        <li><b>effects</b> — 进入场景时自动触发的效果</li>
        <li><b>choices</b> — 玩家选项列表</li>
        <li><b>combat</b> — 战斗配置（可选）</li>
      </ul>

      <h4 style="color:var(--text-primary);margin:16px 0 8px">选项字段</h4>
      <ul style="padding-left:20px">
        <li><b>text</b> — 选项文本</li>
        <li><b>hint</b> — 选项提示（可选）</li>
        <li><b>next</b> — 跳转到下一个场景id</li>
        <li><b>effects</b> — 选择后触发的效果</li>
        <li><b>conditions</b> — 选项出现条件（可选）</li>
        <li><b>check</b> — 属性检定（可选）</li>
        <li><b>combat</b> — 触发战斗（可选）</li>
      </ul>

      <h4 style="color:var(--text-primary);margin:16px 0 8px">效果字段 (effects)</h4>
      <ul style="padding-left:20px">
        <li><b>flag</b> — 添加标记</li>
        <li><b>removeFlag</b> — 移除标记</li>
        <li><b>hp</b> — 加减生命值</li>
        <li><b>sp</b> — 加减灵力</li>
        <li><b>exp</b> — 加减经验</li>
        <li><b>item</b> — 获得物品</li>
        <li><b>removeItem</b> — 失去物品</li>
        <li><b>affection</b> — NPC好感度变更 {"NPC名": 数值}</li>
        <li><b>location</b> — 切换地点</li>
        <li><b>chapter</b> — 切换章节</li>
      </ul>
    </div>
    <button class="btn btn-secondary btn-full" style="margin-top:16px" onclick="closeModalById('save-modal')">关闭</button>
  `;
  modal.style.display = 'flex';
};

window.deleteGame = async function(slug) {
  if (!confirm(`确认删除模板 "${slug}"？此操作不可撤销。`)) return;
  await App.deleteGame(slug);
  navigate('creator');
};
</script>
</body>
